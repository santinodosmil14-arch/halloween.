
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween 🎃</title>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:20px}
h1{font-size:35px;margin-top:30px}
button{padding:15px 30px;font-size:20px;border:none;border-radius:15px;margin:10px;cursor:pointer}
#si{background:orange}
#no{background:#333;color:white}
img{display:none;width:90%;max-width:400px;border-radius:20px;margin-top:20px;box-shadow:0 0 30px orange}
</style>
</head>
<body>
<h1>🎃 ¿Querés ver mi foto de Halloween? 👻</h1>
<button id="si" onclick="mostrar()">Sí quiero</button>
<button id="no" onclick="alert('jaja dale, apreta que si')">No quiero</button>
<br>
<img id="foto" src="foto.jpg">
<p id="texto" style="display:none">¡Acá estoy! 😎</p>
<script>
function mostrar(){
 document.getElementById('foto').style.display='block';
 document.getElementById('texto').style.display='block';
}
</script>
</body>
</html>
